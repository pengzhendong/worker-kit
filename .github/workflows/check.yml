name: Check
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'LICENSE', '.gitignore']
  pull_request:
    paths-ignore: ['**/*.md', 'LICENSE', '.gitignore']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workerkit-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      visual: ${{ steps.changes.outputs.visual }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Select expensive checks from changed files
        id: changes
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci-changes.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
  visual:
    needs: check
    if: needs.check.outputs.visual == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
    env:
      CI: '1'
      WORKERKIT_VISUAL_ENV: playwright-linux-amd64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:ui:run
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-report
          path: |
            playwright-report/
            test-results/
          retention-days: 3
