<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 788 208" role="img" aria-labelledby="title desc"><title id="title">WorkerKit 的前端、后端、身份和存储关系</title><desc id="desc">浏览器页面向业务 API 发请求，业务 API 分别调用认证和存储。同一个 Worker 可以提供这组能力。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0l7 3.5L0 7z" fill="#8798b3"/></marker></defs><rect width="788" height="208" rx="14" fill="#f8fafd"/><g fill="none" stroke="#8798b3" stroke-width="2" marker-end="url(#arrow)"><path d="M227 86h55"/><path d="M485 86h28V61h27"/><path d="M485 86h28v61h27"/></g><g font-family="system-ui, sans-serif"><rect x="32" y="45" width="195" height="82" rx="10" fill="#eaf1ff" stroke="#315bd6" stroke-opacity=".25"/><text x="48" y="76" fill="#315bd6" font-size="20" font-weight="650">前端</text><text x="48" y="100" fill="#334660" font-size="15">组件库或后台模板</text><rect x="290" y="45" width="195" height="82" rx="10" fill="#edf7f4" stroke="#147d66" stroke-opacity=".25"/><text x="306" y="76" fill="#147d66" font-size="20" font-weight="650">业务 API</text><text x="306" y="100" fill="#334660" font-size="15">Hono / Nitro / 框架路由</text><rect x="548" y="24" width="208" height="74" rx="10" fill="#f6edff" stroke="#7842ad" stroke-opacity=".25"/><text x="564" y="55" fill="#7842ad" font-size="20" font-weight="650">认证</text><text x="564" y="79" fill="#334660" font-size="15">Better Auth / CMS</text><rect x="548" y="110" width="208" height="74" rx="10" fill="#fff5e6" stroke="#98651f" stroke-opacity=".25"/><text x="564" y="141" fill="#98651f" font-size="20" font-weight="650">存储与任务</text><text x="564" y="165" fill="#334660" font-size="15">D1 / KV / R2 / DO</text></g></svg>
