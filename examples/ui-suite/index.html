<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>WorkerKit · 界面预览</title>
    <link rel="icon" type="image/svg+xml" href="/nuxt/favicon.svg" />
    <link rel="stylesheet" href="./preview.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <img
          class="logo"
          src="/nuxt/favicon.svg"
          alt=""
          width="28"
          height="28"
        /><strong>WorkerKit</strong>
      </div>
      <select id="preview-category" aria-label="预览类别">
        <option value="components">组件库</option>
        <option value="templates">后台模板</option>
        <option value="docs">文档</option>
        <option value="backend" hidden disabled>后端</option>
      </select>
      <nav id="ui-views" role="tablist" aria-label="组件库方案">
        <button role="tab" data-view="adminlte">AdminLTE</button>
        <button role="tab" data-view="pro">Ant Design Pro</button>
        <button role="tab" data-view="element">Element Plus</button>
        <button role="tab" data-view="mantine">Mantine</button>
        <button role="tab" data-view="mui">MUI</button>
        <button role="tab" data-view="naive">Naive UI</button>
        <button role="tab" data-view="nuxt">Nuxt UI</button>
        <button role="tab" data-view="primevue">PrimeVue</button>
        <button role="tab" data-view="pro-components">ProComponents</button>
        <button role="tab" data-view="pure">PureAdmin</button>
        <button role="tab" data-view="quasar">Quasar</button>
        <button role="tab" data-view="refine">Refine</button>
        <button role="tab" data-view="prime">Sakai</button>
        <button role="tab" data-view="shadcn">shadcn-vue</button>
        <button role="tab" data-view="soybean">Soybean</button>
        <button role="tab" data-view="tabler">Tabler</button>
        <button role="tab" data-view="vben">Vben Admin</button>
        <button role="tab" data-view="docs">VitePress</button>
        <button role="tab" data-view="vuetify">Vuetify</button>
      </nav>
      <nav id="backend-views" role="tablist" aria-label="后端方案" hidden>
        <button role="tab" data-view="astro">Astro</button>
        <button role="tab" data-view="standard">Hono + Better Auth</button>
        <button role="tab" data-view="native">Hono + KV 登录</button>
        <button role="tab" data-view="hub">Nuxt / Nitro</button>
        <button role="tab" data-view="payload">Payload</button>
        <button role="tab" data-view="react-router">React Router</button>
        <button role="tab" data-view="sonic">SonicJS</button>
        <button role="tab" data-view="sveltekit">SvelteKit</button>
      </nav>
      <div class="actions">
        <a id="architecture" href="/docs/architecture.html" target="_blank" rel="noopener"
          >技术地图</a
        >
        <button id="desktop" aria-pressed="true">桌面</button
        ><button id="mobile" aria-pressed="false">手机</button
        ><a id="open" target="_blank" rel="noopener">独立打开 ↗</a>
      </div>
    </header>
    <div class="stage" aria-busy="true">
      <span
        id="loading"
        role="status"
        style="
          position: absolute;
          align-self: center;
          padding: 10px 16px;
          background: #fff;
          border: 1px solid #d8dfeb;
          border-radius: 8px;
          z-index: 1;
        "
        >正在加载界面…</span
      >
    </div>
    <script type="module" src="./preview.js"></script>
  </body>
</html>
